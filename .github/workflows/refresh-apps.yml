name: Refresh app screenshots

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      all:
        description: Re-import every app, not only apps with a new App Store version
        type: boolean
        default: false
      dry_run:
        description: Only report what changed, don't update anything
        type: boolean
        default: false

concurrency:
  group: app-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Refresh apps
        run: npx tsx scripts/refresh-apps.ts ${{ inputs.all && '--all' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
