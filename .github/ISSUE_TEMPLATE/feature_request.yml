name: Feature request
description: Suggest an improvement to Screeny.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need or friction.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Describe the change you have in mind.
    validations:
      required: true
